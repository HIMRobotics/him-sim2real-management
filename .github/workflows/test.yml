name: Test recorder and simulation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} python -m pytest -q tests/test_app.py tests/test_kit.py tests/test_remote.py
      - run: uv run --locked --python ${{ matrix.python }} python -m py_compile app.py remote.py g1_session.py policy_hook.py
      - run: bash -n OPEN_APP.sh kit.sh start.sh label.sh
  simulation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv venv --python 3.12 .venv-policy-safety
      - run: uv pip install --python .venv-policy-safety/bin/python './packages/policy_safety[test]'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 containers/sim/viewer_assets.py
      - run: >-
          .venv-policy-safety/bin/python -m pytest -q tests containers/sim packages/policy_safety/tests
          --ignore=tests/ros2 --ignore=tests/test_app.py --ignore=tests/test_kit.py --ignore=tests/test_remote.py
        env:
          G1_SIM_PYTHON: ${{ github.workspace }}/.venv-policy-safety/bin/python
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: for script in submit.sh sim.sh desktop_sim.sh containers/sim/*.sh setup.sh containers/examples/entrypoint.sh containers/template/*.sh; do bash -n "$script" || exit; done
