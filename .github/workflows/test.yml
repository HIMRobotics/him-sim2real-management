name: Test recorder and local app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py g1_session.py policy_hook.py
      - run: bash -n OPEN_APP.sh kit.sh start.sh label.sh
