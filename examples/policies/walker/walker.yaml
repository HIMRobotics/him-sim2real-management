contract: nvidia-decoupled-wbc-516-v1
robot: unitree-g1-29dof
normalization: explicit
control_seconds: 0.02
physics_seconds: 0.002
model:
  file: walker.onnx
  balance_file: balance.onnx
  input:
    shape:
    - 1
    - 516
    dtype: float32
  output:
    shape:
    - 1
    - 15
    dtype: float32
command:
- vx
- vy
- yaw_rate
action: position_target
decode: lower_body_default + raw_output * 0.25
upper_body: neutral_position_hold
desired_velocity: 0
feedforward_torque: 0
observation:
