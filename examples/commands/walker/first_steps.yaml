# Operator-run commissioning sequence. Times start at policy handoff.
# The final zero command continues Balance control, not motor damping.
segments:
  - seconds: 2.0
    command: [0.0, 0.0, 0.0]
  - seconds: 1.0
    command: [0.05, 0.0, 0.0]
  - seconds: 2.0
    command: [0.10, 0.0, 0.0]
  - seconds: 1.0
    command: [0.05, 0.0, 0.0]
  - command: [0.0, 0.0, 0.0]
