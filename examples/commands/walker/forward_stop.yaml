# Walk, then step the command down to a stop. vy stays 0.
# Times start when the gait starts. The last command holds for the rest of the run.
# Zero velocity asks the walker to stand. Use --seconds 7 to show the stop.
segments:
  - seconds: 2.0
    command: [0.50, 0.0, 0.0]
  - seconds: 1.0
    command: [0.40, 0.0, 0.0]
  - seconds: 1.0
    command: [0.30, 0.0, 0.0]
  - seconds: 1.0
    command: [0.20, 0.0, 0.0]
  - seconds: 1.0
    command: [0.10, 0.0, 0.0]
  - command: [0.0, 0.0, 0.0]
